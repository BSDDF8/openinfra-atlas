# OpenInfra Atlas — Production Nginx Configuration for AWS EC2
# Place in: /etc/nginx/sites-available/openinfra-atlas
# Symlink to: /etc/nginx/sites-enabled/openinfra-atlas

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your EC2 Elastic IP or domain name

    root /var/www/openinfra-atlas;
    index index.html index.htm;

    # Gzip Compression for High Performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Single Page Application (SPA) Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (Vite hashed bundles)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
